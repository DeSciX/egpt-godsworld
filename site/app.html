<!doctype html>
<!-- Copyright 2023-2026 by Essam Abadir -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maxi's Lab — Gods World</title>
<meta name="description" content="Maxi's Lab: the FRQTL scene with Maxi's conversation beside it. Say what to imagine; Maxi builds it from the frqtl SDK and looks at it through his own eyes.">
<link rel="icon" href="images/share/favicon.ico">
<style>
  :root { --bg: #05070a; --bar: #0b1016; --ink: #d7e3ee; --dim: #7f93a6; --cyan: #5fd3ff; --line: #1b2733; --err: #ff6b6b; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  body { display: flex; flex-direction: column; min-height: 100%; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 12px; background: var(--bar); border-bottom: 1px solid var(--line); }
  header strong { color: var(--cyan); letter-spacing: .04em; }
  header select, header button { background: #111a24; color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; font: inherit; }
  header button[aria-pressed="true"] { border-color: var(--cyan); color: var(--cyan); }
  header button:disabled { opacity: .5; }
  #status { color: var(--dim); margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60vw; }
  main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; position: relative; min-width: 0; background: #000; }
  #stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
  header button#btn-record[aria-pressed="true"] { border-color: var(--err); color: var(--err); }
  #demo { position: absolute; right: 12px; bottom: 12px; width: min(360px, calc(100vw - 24px)); background: var(--bar); border: 1px solid var(--cyan); border-radius: 6px; padding: 8px; z-index: 4; box-shadow: 0 0 12px rgba(95,211,255,.35); }
  #demo[hidden] { display: none; }
  #demo .demo-head { display: flex; align-items: center; gap: 8px; color: var(--cyan); margin-bottom: 6px; }
  #demo .demo-head span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #demo video { width: 100%; background: #000; border-radius: 4px; display: block; }
  #demo pre { margin: 6px 0 0; max-height: 120px; overflow: auto; white-space: pre-wrap; font-size: 11px; color: var(--ink); }
  aside#talk { width: min(380px, 100vw); border-left: 1px solid var(--line); background: var(--bar); display: flex; flex-direction: column; min-height: 0; }
  aside#talk .talk-head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; color: var(--cyan); border-bottom: 1px solid var(--line); }
  aside#talk .talk-head span { flex: 1; }
  aside#talk .talk-head button { background: #111a24; color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; font: inherit; }
  #talk-lines { flex: 1; overflow: auto; padding: 8px 10px; font: 13px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
  .talk-row { margin: 0 0 10px; }
  .talk-row b { display: block; font-size: 11px; letter-spacing: .04em; color: var(--dim); }
  .talk-row p { margin: 2px 0 0; white-space: pre-wrap; }
  .talk-maxi b { color: var(--cyan); }
  .talk-pending p { color: var(--dim); font-style: italic; }
  .talk-refused p { color: var(--err); }
  .talk-row small { display: block; color: var(--dim); font-size: 10.5px; margin-top: 2px; }
  .talk-tony b { color: var(--ink); }
  .talk-builder b { color: #ffb070; }
  .talk-owl b { color: #c7a6ff; }
  .talk-row video { width: 100%; margin-top: 6px; background: #000; border-radius: 4px; display: block; }
  .talk-approve p { color: #8fe3a1; }
  form#imagine { display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--line); }
  form#imagine input { flex: 1; min-width: 0; background: #05070a; color: var(--ink); border: 1px solid var(--cyan); border-radius: 6px; padding: 8px 10px; font: 13px/1.3 system-ui, -apple-system, Segoe UI, sans-serif; }
  form#imagine input:disabled { opacity: .55; border-color: var(--line); }
  aside#code[hidden] { display: none; }
  aside#code { width: min(420px, 100vw); border-left: 1px solid var(--line); background: var(--bar); display: flex; flex-direction: column; min-height: 0; }
  aside#code .code-head { padding: 6px 10px; color: var(--dim); border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  aside#code pre { margin: 0; padding: 10px; overflow: auto; flex: 1; font-size: 11.5px; line-height: 1.35; color: var(--ink); }
  #says { padding: 6px 12px; border-top: 1px solid var(--line); background: var(--bar); color: var(--cyan); }
  #error { padding: 8px 12px; background: #1a0000; color: var(--err); border-top: 1px solid #b6161c; white-space: pre-wrap; font-size: 12px; }
  @media (max-width: 720px) { main { flex-direction: column; } aside#talk { width: 100%; max-height: 40vh; border-left: 0; border-top: 1px solid var(--line); } aside#code { position: absolute; right: 0; top: 0; bottom: 0; z-index: 2; } #status { max-width: 100%; margin-left: 0; } }
</style>
</head>
<body>
<header>
  <strong>MAXI'S LAB</strong>
  <select id="scene-picker" aria-label="Scene"></select>
  <button id="btn-run" type="button" disabled>Pause</button>
  <button id="btn-restart" type="button" disabled>Restart</button>
  <button id="btn-hand" type="button" aria-pressed="false" title="Hand tool: pick up and move objects (H; Esc leaves)" disabled>Hand</button>
  <button id="btn-record" type="button" aria-pressed="false" title="Record a demonstration for Maxi: the clip and every change you make (R)" disabled>Record</button>
  <button id="btn-code" type="button" aria-pressed="false">Scene code</button>
  <span id="status">booting …</span>
</header>
<main>
  <div id="stage">
    <!-- The demonstration card: what Record just handed Maxi (first clip + the change lines); his answer is on the strip. -->
    <div id="demo" hidden>
      <div class="demo-head"><span id="demo-title"></span><button id="demo-close" type="button" aria-label="close">×</button></div>
      <video id="demo-clip" controls muted playsinline></video>
      <pre id="demo-changes"></pre>
    </div>
  </div>
  <!-- The conversation, WORDS only: Tony's outline, Maxi's plan, the Builder's "built — watch" with its clip,
       the Owl's verdict (app-assets/maxi-loop.js), and every clip the lab handed Maxi with his answer. -->
  <aside id="talk" aria-live="polite">
    <div class="talk-head"><span>Maxi</span><button id="talk-new" type="button" title="Start a new conversation with Maxi">New conversation</button></div>
    <div id="talk-lines"></div>
    <form id="imagine" autocomplete="off"><input id="imagine-text" type="text" placeholder="Imagine…" aria-label="Imagine: an outline for Maxi (Enter sends)" disabled></form>
  </aside>
  <aside id="code" hidden>
    <div class="code-head" id="code-title"></div>
    <pre id="code-text"></pre>
  </aside>
</main>
<div id="says" hidden></div>
<div id="error" hidden></div>
<!-- The DeSciX bridge first (classic), then host-view.js (the one declarer: the whole frame, CodeSite, recorded on <html data-descix-view>), then the lab, which reads that record. -->
<script src="DeSciXAppSDK.js"></script>
<script type="module" src="app-assets/host-view.js"></script>
<script type="module" src="app-assets/maxi-lab.js"></script>
</body>
</html>
